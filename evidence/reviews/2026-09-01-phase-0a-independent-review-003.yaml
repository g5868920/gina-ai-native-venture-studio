    title: Test fixtures moved out of the repository
    rationale: >
      Three consecutive reviews could not execute the suite because tests wrote fixtures
      under generated/. That is a standing, compounding limit on review quality, not a
      one-off inconvenience. Fixtures now live in an OS temp directory created per run.
    verified: >
      `git status --porcelain` and a recursive listing of generated/ are byte-identical
      before and after `pnpm test`; zero leftover scratch paths inside the repository.

