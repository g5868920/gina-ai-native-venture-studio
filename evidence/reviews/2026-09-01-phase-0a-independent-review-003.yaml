findings:
  - id: F-01
    severity: high
    title: Injected registries bypassed canonical identifier validation
    reviewer_verdict: NOT RESOLVED
    evidence: >
      Resolver APIs accept a caller-supplied VentureRegistry and called only
      assertVentureRegistryIntegrity(); the strict Zod schema ran solely inside
      loadVentureRegistry(). A probe injecting an active Nodi entry with
      project_id " twinko " returned {"ok":true,"projectId":" twinko "}.
    status: fixed
    disposition:
      by: implementer
      action: FIXED — confirmed, and worse than reported
      detail: >
        Reproduced before fixing, and found a second shape the report did not list: an
        uppercase id carrying an unknown extra field was also accepted. This was a genuine
        project-authorization boundary failure, not a theoretical one, so it was fixed
        rather than dispositioned. assertVentureRegistryIntegrity now runs the canonical
        Zod schema before its semantic rules, so every path that can reach a write
        decision validates shape. Six regression tests injecting malformed registries
        (padded, uppercase, empty, unknown field, bad lifecycle) assert all three public
        resolvers throw, plus one asserting a well-formed injected registry still works.
  - id: F-02
    reviewer_verdict: RESOLVED
  - id: F-03
    reviewer_verdict: RESOLVED
  - id: F-04
    reviewer_verdict: RESOLVED
  - id: F-05
    severity: medium
    title: Test coverage gaps
    reviewer_verdict: NOT RESOLVED
    status: fixed
    disposition:
      by: implementer
      action: FIXED for three of four gaps; one declined again with rationale
      remediated:
        - injected schema-invalid registry (7 tests)
        - package-order test extended to the public `build` and `test` commands
        - preflight drift test extended to a Git-origin-mismatch checkout
      declined:
        - item: compiled child-process symlink invocation of the CLI
          rationale: >
            `pnpm test` does not build, so the test would depend on a stale or absent
            dist/ and would fail for reasons unrelated to the behaviour under test. The
            guard's logic is covered directly by three unit tests over isDirectInvocation(),
            including the symlink and non-normalized-path cases that produced the original
            silent no-op defect.
  - id: F-06
    reviewer_verdict: RESOLVED
  - id: NF-01
    reviewer_verdict: RESOLVED
  - id: NF-02
    severity: medium
    title: Preflight boundary incomplete at public build/test, and checker parity gap
    reviewer_verdict: NOT RESOLVED
    status: fixed
    disposition:
      by: implementer
      action: FIXED — both halves confirmed and corrected
      detail: >
        (a) `build` and `test` now run `pnpm preflight` first, so every public command
        that compiles or writes fixtures is guarded, not only demo/portfolio-review/verify.
        (b) The parity gap was real and was mine: I had deliberately omitted the Git-origin
        check from scripts/preflight.mjs while the compiled checker enforced it, so a
        marker-complete checkout with a foreign origin passed the pre-build guard and was
        refused only later. A guard that exists in one of a matched pair is a defect in the
        pair whatever its individual value, and the drift test's "cannot drift" claim was
        false in that dimension. preflight.mjs now mirrors all three signals, and the drift
        test covers a real wrong-origin checkout.
  - id: NEW-01
    severity: nit
    title: Stale-deletion citation pointed to the wrong amendment item
    reviewer_verdict: OPEN
    blocking: false
    status: fixed
    disposition:
      by: implementer
      action: FIXED — CLAUDE.md now cites 0010 Amendment §0 (the deletion clause).

implementer_additional_remediation:
