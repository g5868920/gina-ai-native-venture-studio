new_findings:
  - id: R4-01
    severity: low
    blocking: false
    title: Missing CLI input file produced an unhandled stack trace
    evidence: >
      readFileSync ran outside the CLI's error handling; `node dist/cli.js <missing>`
      exited 1 with an uncaught ENOENT stack trace instead of the normal
      "INVALID <file>: …" report. Reproduced by the implementer before fixing.
    status: fixed
    disposition:
      by: implementer
      action: FIXED — not dispositioned
      rationale: >
        Non-blocking, but the CLI states a legible invalid-input contract and this broke
        it. A five-line fix is cheaper and more honest than a recorded risk acceptance.
      remediation: >
        Each input read is wrapped per file; an unreadable path reports
        "INVALID <file>: cannot read input — …", increments the invalid count, and
        preserves the no-output-on-any-invalid-input rule. One CLI test asserts the exit
        code, the message, and the ABSENCE of a raw stack trace.
  - id: R4-02
    severity: nit
    blocking: false
    title: Test suite left its temporary scratch root behind
    evidence: >
      SCRATCH was created with mkdtempSync at module load with no suite-level cleanup;
      four empty studio-phase0a-* directories had accumulated in the OS temp directory.
    status: fixed
    disposition:
      by: implementer
      action: FIXED — afterAll removes the scratch root
      verification: >
        Stale directories cleared, then a full run left zero. The suite is now neutral to
        the whole filesystem, not only to the worktree.

